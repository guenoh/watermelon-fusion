name: Build and deploy web game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Cache official Godot build tools
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: .godot-tools
          key: godot-3.5.3-linux-web-v2
      - name: Download Godot 3.5.3 and web export template
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-tools
          base=https://github.com/godotengine/godot-builds/releases/download/3.5.3-stable
          curl --fail --location --retry 3 "$base/Godot_v3.5.3-stable_x11.64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -j "$RUNNER_TEMP/godot.zip" -d .godot-tools
          mv .godot-tools/Godot_v3.5.3-stable_x11.64 .godot-tools/godot
          chmod +x .godot-tools/godot
          curl --fail --location --retry 3 "$base/Godot_v3.5.3-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -j "$RUNNER_TEMP/templates.tpz" templates/webassembly_release.zip -d .godot-tools
      - name: Import assets and export browser game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          export LIBGL_ALWAYS_SOFTWARE=1
          # A pack export waits for the full initial resource scan; --editor
          # --quit can exit before newly added SVGs/fonts have been scanned.
          # Use a real render context for preloaded visual resources.
          timeout 120s xvfb-run -a .godot-tools/godot --audio-driver Dummy --path . --export-pack Web "$RUNNER_TEMP/bootstrap.pck"
          # New filenames prevent browsers reusing an older engine/game pack.
          web_name="game-${GITHUB_SHA::8}"
          timeout 120s xvfb-run -a .godot-tools/godot --audio-driver Dummy --path . --export Web "build/web/$web_name.html" 2>&1 | tee "$RUNNER_TEMP/export.log"
          timeout 30s xvfb-run -a .godot-tools/godot --audio-driver Dummy --path . --script tests/drag_controls.gd 2>&1 | tee "$RUNNER_TEMP/controls.log"
          timeout 30s xvfb-run -a .godot-tools/godot --audio-driver Dummy --path . --script tests/family_bombs.gd 2>&1 | tee "$RUNNER_TEMP/family.log"
          timeout 30s xvfb-run -a .godot-tools/godot --audio-driver Dummy --path . --script tests/rolling_physics.gd 2>&1 | tee "$RUNNER_TEMP/rolling.log"
          timeout 45s xvfb-run -a .godot-tools/godot --audio-driver Dummy --path . --script tests/special_bubbles.gd 2>&1 | tee "$RUNNER_TEMP/specials.log"
          timeout 30s xvfb-run -a .godot-tools/godot --audio-driver Dummy --path . --script tests/mom_remix.gd 2>&1 | tee "$RUNNER_TEMP/mom.log"
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' "$RUNNER_TEMP/controls.log" "$RUNNER_TEMP/family.log" "$RUNNER_TEMP/rolling.log" "$RUNNER_TEMP/specials.log" "$RUNNER_TEMP/mom.log" "$RUNNER_TEMP/export.log"; then
            exit 1
          fi
          mv "build/web/$web_name.html" build/web/index.html
          test -s build/web/index.html
          test -s "build/web/$web_name.js"
          test -s "build/web/$web_name.wasm"
          test -s "build/web/$web_name.pck"
          cp LICENCE build/web/LICENCE
          cp Game/HUD/Fonts/OFL.txt build/web/Font-LICENSE.txt
          touch build/web/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload web game
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
