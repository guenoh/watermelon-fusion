<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#86fa95">
  <meta name="description" content="좌우로 드래그하고 손을 떼면 얼굴 공이 떨어져요. 아빠와 함께 즐기는 얼굴 합치기!">
  <title>얼굴 합치기 · Watermelon Fusion</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { background: #15382b; color: #fff; font-family: system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center; overflow: hidden; }
    main { position: relative; flex: none; width: min(100vw, calc((100vh - 64px) * 9 / 16));
      width: min(100vw, calc((100dvh - 64px - env(safe-area-inset-bottom)) * 9 / 16));
      aspect-ratio: 9 / 16; margin: auto 0; background: #86fa95; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
    #welcome { position: absolute; inset: 0; display: grid; place-content: center; padding: 24px;
      text-align: center; color: #15382b; background: #86fa95; }
    #welcome[hidden] { display: none; }
    .fruit { font-size: 72px; margin: 0; }
    h1 { margin: 12px 0; font-size: clamp(24px, 7vw, 38px); }
    p { line-height: 1.7; }
    button { padding: 16px 28px; border: 0; border-radius: 18px; background: #15382b;
      color: white; font: inherit; font-weight: 700; font-size: 20px; cursor: pointer; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    button:disabled { cursor: wait; opacity: .7; }
    #message { max-width: 320px; min-height: 2em; font-size: 14px; overflow-wrap: anywhere; }
    progress { width: 100%; accent-color: #15382b; margin: 12px 0; }
    progress[hidden] { display: none; }
    footer { flex: none; min-height: 32px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
      text-align: center; font-size: 10px; line-height: 20px; }
    a { color: #c5f4d4; }
  </style>
$GODOT_HEAD_INCLUDE
</head>
<body>
  <main aria-label="얼굴 합치기 게임">
    <canvas id="canvas" width="720" height="1280" tabindex="0" aria-label="좌우로 드래그해 위치를 맞추고 손을 떼면 얼굴 공이 떨어져요">
      이 브라우저에서는 게임 화면을 표시할 수 없어요. 최신 브라우저로 열어 주세요.
    </canvas>
    <section id="welcome" aria-labelledby="title">
      <p class="fruit" aria-hidden="true">🙂</p>
      <h1 id="title">얼굴 합치기</h1>
      <p>좌우로 끌고 손을 떼면 톡!<br>특별 버블은 모두 합쳐 1% 확률!<br>폭탄은 펑! · 수안이는 어떤 얼굴이든 합체!<br>수민이는 처음 닿은 얼굴을 5개로!<br>엄마는 바닥에서 “빨리빨리!” 다 같이 섞기!</p>
      <button id="start" type="button">같이 놀기</button>
      <progress id="progress" max="100" value="0" aria-label="게임 불러오는 중" hidden></progress>
      <p id="message" role="status" aria-live="polite">소리를 켜고 즐겨 보세요.</p>
    </section>
  </main>
  <footer>
    <a href="https://github.com/koopmyers/watermelon-fusion" target="_blank" rel="noopener">Watermelon Fusion © 2023 Koop Myers</a>
    · <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a>
    · <a href="https://github.com/guenoh/watermelon-fusion" target="_blank" rel="noopener">웹 버전 소스</a>
    · <a href="https://godotengine.org/license/" target="_blank" rel="noopener">Godot</a>
    · <a href="Font-LICENSE.txt" target="_blank" rel="noopener">글꼴</a>
  </footer>
  <script src="$GODOT_URL"></script>
  <script>
    const config = $GODOT_CONFIG;
    const engine = new Engine(config);
    const start = document.getElementById('start');
    const message = document.getElementById('message');
    const progress = document.getElementById('progress');
    start.addEventListener('click', async () => {
      if (start.dataset.retry) { location.reload(); return; }
      if (!Engine.isWebGLAvailable(1)) {
        message.textContent = 'WebGL을 지원하는 최신 Chrome 또는 Safari로 열어 주세요.';
        return;
      }
      start.disabled = true;
      start.textContent = '불러오는 중…';
      progress.hidden = false;
      message.textContent = '처음에는 게임을 내려받는 데 잠깐 걸릴 수 있어요.';
      try {
        await engine.startGame({
          canvas: document.getElementById('canvas'),
          onProgress(current, total) {
            if (total > 0) progress.value = current / total * 100;
          }
        });
        document.getElementById('welcome').hidden = true;
        document.getElementById('canvas').focus();
      } catch (error) {
        console.error(error);
        message.textContent = '게임을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.';
        progress.hidden = true;
        start.textContent = '다시 시도';
        start.dataset.retry = 'true';
        start.disabled = false;
      }
    });
  </script>
</body>
</html>
